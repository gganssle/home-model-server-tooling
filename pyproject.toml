[project]
name = "hearth"
version = "0.1.0"
description = "Local chat + image generation server for Apple Silicon, with CLI and web frontends"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "prompt-toolkit>=3.0",
    "huggingface-hub>=0.26",
    "mlx>=0.32",
    "mlx-vlm>=0.6.17",
    "mflux>=0.19.1",
    "pillow>=11.0",
    "tomli-w>=1.0",
]

[project.scripts]
hearth = "hearth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth"]
